[project]
name = "squadup-agents"
version = "0.1.0"
description = "SquadUp Gemini agents service (Interviewer, Summarizer, Recommender)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.20",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
